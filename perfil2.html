body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f0f0;
}

/* Contenedor que agrupa barra y recuadros */
.center-wrapper {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 600px;
}

/* Barra de navegación centrada */
.navbar {
    position: relative;
    top: 1205px;
    left: 70px;
    display: flex;
    justify-content: center;
    gap: 80px;
    font-size: 22px;
    font-weight: bold;
    margin-top: 20%;
    margin-bottom: 10px;
    font-family: "Outfit", sans-serif;
    cursor: pointer;
}

.navbar div {
    position: relative;
}

.navbar div:hover::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 2px;
    background: black;
    bottom: -4px;
    left: 0;
}

/* Recuadros debajo */
.content-box {
    display: none;
    position: fixed;
    top: 60%; /* Ajustá según el alto de tu encabezado */
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    padding: 20px;
    border-radius: 10px;
    width: 300px; /* o el tamaño que prefieras */
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    margin-top: 20px; /* Espacio entre la barra y el cuadro desplegado */
    background-color: white;
}

.close {
    margin-top: 10px;
    background: #ddd;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
}

#like-count {
    font-weight: bold;
    margin-left: 5px;
}

input[type="date"], input[type="file"] {
    font-size: 16px;
    padding: 6px;
    margin-top: 10px;
}


.icon-container {
    position: absolute;
    right: 20px;
    top: 230px;
    display: flex;
    gap: 10px;
    font-size: 40px; /* Tamaño de los íconos */

}

.icon-container i {

.header {

.icon-button {

body {
    --main-color: #7ccd98;
    background-color: var(--main-color);
    transition: background-color 0.5 ease;
}

/* Ajustes para que la sección quede claramente debajo de la cabecera/ avatar */
.video-section{
    clear: both;             /* asegura que no quede junto a elementos flotantes */
    margin-top: 204%;        /* separa de la línea de tabs; aumentá si el avatar lo tapa */
    padding: 10px 0 50px 0;  /* espacio superior e inferior */
    width: 165%;
    box-sizing: border-box;
    position: relative;
    z-index: 0;
}

/* Cambiamos el wrapper de flex a grid para manejar filas y columnas */
.video-wrapper {
    width: 90%; /* Ajustado para mejor centrado */
    max-width: 950px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Crea las dos columnas */
    gap: 40px; /* Espacio entre videos */
    justify-items: center;
    box-sizing: border-box;
}

/* Ajustamos la tarjeta para que no use flexbox innecesario */
.video-card {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* Control de tamaño del elemento <video> para evitar altas desagradables */
.video-card video{
    width: 100%;
    aspect-ratio: 16 / 9; /* fija proporción 16:9; evita videos extremadamente altos */
    height: auto;
    display: block;
    border-radius: 8px;
    background: #000;
}

/* Títulos opcionales debajo de cada video */
.video-title{
    font-size: 20px;
    font-weight: bold;
    color: #083; /* ajustalo a tu paleta */
    text-align: center;
}

/* Responsive: en pantallas pequeñas apilar verticalmente */
@media (max-width: 720px){
    .video-wrapper{
        flex-direction: column;
        gap: 18px;
        align-items: center;
    }
    .video-card{
        flex: 0 1 100%;
        max-width: 600px; /* o 100% */
    }
}

.about-modal {
    display: none;              /* oculto por defecto */
    position: fixed;            /* se fija en toda la ventana */
    top: 0;
    left: 0;
    width: 100vw;               /* ocupa todo el ancho del viewport */
    height: 100vh;              /* ocupa toda la altura del viewport */
    background: rgba(0, 0, 0, 0.6); /* fondo oscuro semitransparente */
    z-index: 9999;              /* 🔹 valor alto para sobreponerse a todo */
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(3px); /* efecto de desenfoque */
}

.about-content {
    background: linear-gradient(180deg, #e8ffd6, #9dffba); /* beige suave a amarillo tenue */
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    width: 80%;
    max-width: 480px;  /* mantiene ancho controlado */
    height: 400px;     /* más alto que ancho */
    text-align: left;
    font-family: 'Segoe UI', sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    filter: none !important;
    animation: fadeIn 0.3s ease-out;
    align-items: flex-start;   /* <-- Esto libera el título y lo lleva a la izquierda */
    border: 2px solid rgba(255, 215, 0, 0.3); /* borde dorado sutil */
}

.about-content h2 {
    font-size: 1.5rem;
    color: #2b2b2b;
    margin-bottom: 75px;
    margin-top: -10px;
    text-align: center;

}

.about-content h3 {
    font-size: 1.2rem;
    color: #3e3e3e;
    margin-bottom: 8px;
}

.about-content p {
    font-size: 1.05rem;
    color: #333;
    line-height: 1.5;
    margin-bottom: 12px;
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 1.8rem;
    font-weight: bold;
    color: #666;
    cursor: pointer;
    transition: transform 0.2s ease, color 0.2s ease;
}


/* Animación de entrada suave */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


#page-wrapper.blurred {
    filter: blur(6px);
    pointer-events: none; /* evita interactuar con el fondo mientras el modal está abierto */
}

.blurred {
    filter: blur(4px);
    pointer-events: none;
}


#logo-circulo.blurred {
    filter: blur(6px);
}

.blurred #profileLogo {
    filter: blur(4px);
    opacity: 0.6;
    transition: 0.3s;
}


/* --- OVERLAYS DE CARGA (Centrados exactos) --- */
#logo-overlay, #header-loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: var(--main-color);
    z-index: 50000; /* Prioridad máxima */
    display: none; /* Se activa por JS */
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* El spinner de carga */
.loader-circle {
    width: 80px !important;
    height: 80px !important;
    border: 6px solid rgba(255, 255, 255, 0.2);
    border-top: 6px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-sizing: border-box;
    display: block;
}

.loading-text-universal {
    margin-top: 15px;
    font-size: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: white;
    font-family: "Outfit", sans-serif;
    text-align: center;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* El logo que hará la animación */
.logo-zoom-element {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    /* Empieza en la posición del logo original (20% a la izquierda) */
    left: 10px; 
    transform: translate(-50%, -50%) scale(1);
    opacity: 0;
    transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); /* Efecto elástico */
}

/* Clase que se activa después de 3 segundos */
.logo-zoom-element.active {
    margin-top: 142px;
    opacity: 1;
    left: 780px; /* Se mueve al centro */
    transform: translate(-50%, -50%) scale(2.5); /* Zoom */
}


/* Capa invisible clickeable sobre el header */
#header-click-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    cursor: pointer;
}

#header-image-viewer {
    position: fixed;
    inset: 0;
    background: var(--main-color);
    z-index: 55000;
    display: none;
    justify-content: center;
    align-items: center;

/* Contenedor adaptativo para que la imagen se vea entera */
.header-image-content {
    width: 85vw;

/* Imagen del fondo optimizada para mostrarse íntegramente */
.header-image {

    <script>
        
    // Mostrar y ocultar el modal de video
    function openModal() {
        closeAll();
        document.getElementById('modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    // Mostrar y ocultar calendario
    function toggleCalendar() {
        const box = document.getElementById('calendar-box');
        const isVisible = box.style.display === 'block';
        closeAll();
        if (!isVisible) box.style.display = 'block';
    }

    // 📌 Función CORREGIDA para abrir el modal "Acerca de"
    // Se ejecuta SOLO al hacer click en el enlace
    function showAbout() {
        closeAll(); // Cierra otros modales/cajas si están abiertos
        const modal = document.getElementById("aboutModal");
        const joinDate = document.getElementById("join-date");

        const today = new Date();
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        joinDate.textContent = `Te uniste el ${today.toLocaleDateString('es-ES', options)}`;

        modal.style.display = "flex"; // Muestra el modal

        // Aplica el difuminado al wrapper de la página
        document.getElementById("page-wrapper").classList.add("blurred");
        // Esto es opcional, si quieres difuminar el logo también
        document.getElementById("logo-circulo").classList.add("blurred"); 
    }

    // 📌 Función CORREGIDA para cerrar el modal "Acerca de"
    function closeAbout() {
        document.getElementById("aboutModal").style.display = "none"; // Oculta el modal
    
        // Quita las clases de difuminado
        document.getElementById("page-wrapper").classList.remove("blurred");
        document.getElementById("logo-circulo").classList.remove("blurred");
    }

    // Cierra otros modales/cajas (se usará al abrir "Post")
    function closeAll() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('calendar-box').style.display = 'none';
        // Asegura que el modal "Acerca de" también se pueda cerrar desde aquí
        document.getElementById('aboutModal').style.display = 'none'; 
    
        // También elimina el blur si se cierra el modal de otra forma
        document.getElementById("page-wrapper").classList.remove("blurred");
        document.getElementById("logo-circulo").classList.remove("blurred");
    } 
  </script>


    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const paletteIcon = document.getElementById('palette-icon');
            const colorBox = document.getElementById('color-picker-box');
            const colorInput = document.getElementById('color-input');

        // Mostrar u ocultar el selector al hacer clic en el ícono 🎨
        paletteIcon.addEventListener('click', () => {
            colorBox.style.display = (colorBox.style.display === 'none') ? 'block' : 'none';
        });

        // ✅ Hacemos las funciones globales para que funcionen con onclick=""
        window.applyColor = function () {
            const selectedColor = colorInput.value;
            document.body.style.setProperty('--main-color', selectedColor);
        };

        window.closeColorPicker = function () {
        colorBox.style.display = 'none';
        };
    });
    </script>
        


    <script>
        // Al cargar la página
        document.addEventListener("DOMContentLoaded", function () {
            // Tomar valor del localStorage
            let count = localStorage.getItem("visitas");
            if (!count) count = 0;

            // Sumar uno
            count = parseInt(count) + 1;

            // Guardar
            localStorage.setItem("visitas", count);

            // Mostrar en pantalla
            document.getElementById("visit-count").textContent = count + " Visitas";
        });
    </script>

    <script>
        // --- LÓGICA DE CARGA DEL LOGO ---
    const logoOriginal = document.getElementById("logo-circulo");
    const logoOverlay = document.getElementById("logo-overlay");
    const animatingLogo = document.getElementById("animating-logo");

    logoOriginal.addEventListener("click", () => {
        logoOverlay.style.display = "flex";
        document.body.style.overflow = "hidden";
        
        const spinner = logoOverlay.querySelector('.loader-circle');
        const text = logoOverlay.querySelector('.loading-text-universal');
        
        spinner.style.display = "block";
        text.style.display = "block";
        animatingLogo.classList.remove("active");

        setTimeout(() => {
            spinner.style.display = "none";
            text.style.display = "none";
            animatingLogo.classList.add("active");
        }, 3000);
    });

    logoOverlay.addEventListener("click", () => {
        if (animatingLogo.classList.contains("active")) {
            logoOverlay.style.display = "none";
            document.body.style.overflow = "auto";
        }
    });

    // --- LÓGICA DE CARGA DEL FONDO (WALLPAPER) ---
    const headerLayer = document.getElementById("header-click-layer");
    const headerLoading = document.getElementById("header-loading-overlay");
    const imageViewer = document.getElementById("header-image-viewer");

    headerLayer.addEventListener("click", (e) => {
        e.stopPropagation();
        headerLoading.style.display = "flex";
        document.body.style.overflow = "hidden";

        setTimeout(() => {
            headerLoading.style.display = "none";
            imageViewer.style.display = "flex";
        }, 3000);
    });

    imageViewer.addEventListener("click", () => {
        imageViewer.style.display = "none";
        document.body.style.overflow = "auto";
    });
    </script>


</body>
