body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f0f0;
}

/* Contenedor que agrupa barra y recuadros */
.center-wrapper {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 600px;
}

/* Barra de navegación centrada */
.navbar {
    position: relative;
    top: 1205px;
    left: 70px;
    display: flex;
    justify-content: center;
    gap: 80px;
    font-size: 22px;
    font-weight: bold;
    margin-top: 20%;
    margin-bottom: 10px;
    font-family: "Outfit", sans-serif;
    cursor: pointer;
}

.navbar div {
    position: relative;
}

.navbar div:hover::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 2px;
    background: black;
    bottom: -4px;
    left: 0;
}

/* Recuadros debajo */
.content-box {
    display: none;
    position: fixed;
    top: 60%; /* Ajustá según el alto de tu encabezado */
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    padding: 20px;
    border-radius: 10px;
    width: 300px; /* o el tamaño que prefieras */
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    margin-top: 20px; /* Espacio entre la barra y el cuadro desplegado */
    background-color: white;
}

.close {
    margin-top: 10px;
    background: #ddd;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
}

#like-count {
    font-weight: bold;
    margin-left: 5px;
}

input[type="date"], input[type="file"] {
    font-size: 16px;
    padding: 6px;
    margin-top: 10px;
}

.icon-container {
    position: absolute;
    right: 20px;
    top: 230px;
    display: flex;
    gap: 10px;
    font-size: 40px; /* Tamaño de los íconos */
    justify-content: center;
    margin: 50px 5px 0 0;
    z-index: 1000;
}

.icon-container i {
    font-size: 40px;
    margin: 0 10px;
    cursor: pointer;
    color: white;
}

.header {
    position: relative;
}

.icon-button {
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s ease, color 0.3s ease;
}

.icon-button i {
    display: block;
    margin-bottom: 10px;
    color: white;
}

.icon-button:hover {
    transform: scale(1.1);
}

.icon-button span {
    font-size: 16px;
    color: white;
}

#color-picker-box {
    display: none;
    position: fixed;
    top: 400px; /* o top: 60%; */
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 300px;

}

#palette-icon {

    z-index: 9999;

body {
    --main-color: #7ccd98;
    background-color: var(--main-color);
    transition: background-color 0.5 ease;
}

/* Ajustes para que la sección quede claramente debajo de la cabecera/ avatar */
.video-section{
    clear: both;             /* asegura que no quede junto a elementos flotantes */
    margin-top: 204%;        /* separa de la línea de tabs; aumentá si el avatar lo tapa */
    padding: 10px 0 50px 0;  /* espacio superior e inferior */
    width: 165%;
    box-sizing: border-box;
    position: relative;
    z-index: 0;
}


/* Cambiamos el wrapper de flex a grid para manejar filas y columnas */
.video-wrapper {
    width: 90%; /* Ajustado para mejor centrado */
    max-width: 950px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Crea las dos columnas */
    gap: 40px; /* Espacio entre videos */
    justify-items: center;
    box-sizing: border-box;
}

/* Ajustamos la tarjeta para que no use flexbox innecesario */
.video-card {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}


/* Control de tamaño del elemento <video> para evitar altas desagradables */
.video-card video{
    width: 100%;
    aspect-ratio: 16 / 9; /* fija proporción 16:9; evita videos extremadamente altos */
    height: auto;
    display: block;
    border-radius: 8px;
    background: #000;
}


/* Títulos opcionales debajo de cada video */
.video-title{
    font-size: 20px;
    font-weight: bold;
    color: #083; /* ajustalo a tu paleta */
    text-align: center;
}

/* Responsive: en pantallas pequeñas apilar verticalmente */
@media (max-width: 720px){
    .video-wrapper{
        flex-direction: column;
        gap: 18px;
        align-items: center;
    }
    .video-card{
        flex: 0 1 100%;
        max-width: 600px; /* o 100% */
    }
}

.about-modal {
    display: none;              /* oculto por defecto */
    position: fixed;            /* se fija en toda la ventana */
    top: 0;
    left: 0;
    width: 100vw;               /* ocupa todo el ancho del viewport */
    height: 100vh;              /* ocupa toda la altura del viewport */

    z-index: 9999;              /* 🔹 valor alto para sobreponerse a todo */
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(3px); /* efecto de desenfoque */
}

.about-content {
    background: linear-gradient(180deg, #e8ffd6, #9dffba); /* beige suave a amarillo tenue */
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);

    flex-direction: column;

}

}

.about-content p {

}

.close-btn {

    top: 15px;
    right: 20px;
    font-size: 1.8rem;
    font-weight: bold;
    color: #666;
    cursor: pointer;
    transition: transform 0.2s ease, color 0.2s ease;
}

/* Animación de entrada suave */

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#page-wrapper.blurred {
    filter: blur(6px);
    pointer-events: none; /* evita interactuar con el fondo mientras el modal está abierto */
}

.blurred {
    filter: blur(4px);
    pointer-events: none;
}

#logo-circulo.blurred {

}

.blurred #profileLogo {

/* LÁPIZ DE EDICIÓN (DESPLAZADO AL EXTREMO) */

#wallpaper-icon {
    cursor: pointer; 
    color: white;
    display: inline-flex; 
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease,filter 0.3s ease;
    margin: 0 10px;

}

#wallpaper-icon svg { 
    width: 40px; 
    height: 40px; 
    fill: white; 
}

/* ===== PANEL SELECTOR DE FONDOS ===== */

#wallpaper-selector {
    display: none; 
    position: absolute; 
    top: 50px; 
    left: 8px; 
    transform: translateX(-50%);
    background: linear-gradient(200deg, #70BFE0, #ffff6f); 
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px; 
    padding: 12px 10px; 
    z-index: 99997;
    backdrop-filter: blur(10px); 
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    width: 130px;
}

#wallpaper-selector.open { 
    display: block; 
    animation: selectorFadeIn 0.22s ease; 
}

@keyframes selectorFadeIn { 
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(-8px)
    } 
    to { 
        opacity: 1;
        transform: translateX(-50%) translateY(0)
    } 
}

#wallpaper-selector .ws-grid {
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 8px;
} 

#wallpaper-selector .ws-btn {
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    background: rgba(255,255,255,0.08); 
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 10px; 
    padding: 7px 4px; 
    cursor: pointer; 
    transition: all 0.18s ease;
    font-size: 22px; 
    line-height: 1;
}

#wallpaper-selector .ws-btn.active-theme {
    background: rgba(255,255,255,0.28); 
    border-color: rgba(255,255,255,0.7);
    box-shadow: 0 0 8px rgba(255,255,255,0.3);
}

/* ===== CANVAS TRANSPARENTE — sin fondo oscuro ===== */

#wallpaper-canvas {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0;
    width: 100vw; 
    height: 100vh;
    z-index: 99998; 
    pointer-events: auto; 
    cursor: none;
}

#wallpaper-canvas.active { 
    display: block; 
}

#wallpaper-label {
    display: none; 
    position: fixed; 
    bottom: 20px;

    background: rgba(0,0,0,0.55);

    font-size: 15px; 
    font-family: "Outfit",sans-serif;
    z-index: 99999; 
    pointer-events: none; 
    transition: opacity 0.5s ease;
}

    <script>
        
    // Mostrar y ocultar el modal de video
    function openModal() {
        closeAll();
        document.getElementById('modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    // Mostrar y ocultar calendario
    function toggleCalendar() {
        const box = document.getElementById('calendar-box');
        const isVisible = box.style.display === 'block';
        closeAll();
        if (!isVisible) box.style.display = 'block';
    }

    // 📌 Función CORREGIDA para abrir el modal "Acerca de"
    // Se ejecuta SOLO al hacer click en el enlace
    function showAbout() {
        closeAll(); // Cierra otros modales/cajas si están abiertos
        const modal = document.getElementById("aboutModal");
        const joinDate = document.getElementById("join-date");

        const today = new Date();
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        joinDate.textContent = `Te uniste el ${today.toLocaleDateString('es-ES', options)}`;

        modal.style.display = "flex"; // Muestra el modal

        // Aplica el difuminado al wrapper de la página
        document.getElementById("page-wrapper").classList.add("blurred");
        // Esto es opcional, si quieres difuminar el logo también
        document.getElementById("logo-circulo").classList.add("blurred"); 
    }

    // 📌 Función CORREGIDA para cerrar el modal "Acerca de"
    function closeAbout() {
        document.getElementById("aboutModal").style.display = "none"; // Oculta el modal
    
        // Quita las clases de difuminado
        document.getElementById("page-wrapper").classList.remove("blurred");
        document.getElementById("logo-circulo").classList.remove("blurred");
    }

    // Cierra otros modales/cajas (se usará al abrir "Post")
    function closeAll() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('calendar-box').style.display = 'none';
        // Asegura que el modal "Acerca de" también se pueda cerrar desde aquí
        document.getElementById('aboutModal').style.display = 'none';

    <script>

        document.addEventListener('DOMContentLoaded', function(){

        (function(){
            const canvas = document.getElementById('wallpaper-canvas');
            const ctx    = canvas.getContext('2d');
            const label  = document.getElementById('wallpaper-label');
            let isActive=false, currentTheme=-1, particles=[], animFrame=null;

            const themeNames=[
                '🔵 Círculos de luz','🌙 Medias lunas','⚔️ Espadas',
                '⭐ Estrellas amarillas','🦋 Mariposas','🎂 Tortas y pasteles',
                '✝️ Cruces','💀 Calaveras','🍂 Hojas de otoño',
                '🌸 Flores','🎀 Moños','🔮 Botellas'

            ];

            
            function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            canvas.addEventListener('mousemove', stopWallpaper);
            canvas.addEventListener('click', stopWallpaper);

            function stopWallpaper(){
                if(!isActive)return;
                isActive=false; canvas.classList.remove('active'); label.style.display='none';
                if(animFrame) cancelAnimationFrame(animFrame);
                ctx.clearRect(0,0,canvas.width,canvas.height);

            }

            // ===== NUEVO: toggle del panel selector =====
            const selectorPanel = document.getElementById('wallpaper-selector');
                window._selectorOpen = false;

            window.toggleSelector = function(){

                window._selectorOpen = !window._selectorOpen;

                if(window._selectorOpen){
                    selectorPanel.classList.add('open');
                } else {
                    selectorPanel.classList.remove('open');
                }

            };

            // ===== NUEVO: seleccionar un tema desde el panel =====

            window.selectTheme = function(e, themeIndex){
                e.stopPropagation(); // evitar que dispare toggleSelector
                // Quitar activo de todos los botones
                document.querySelectorAll('.ws-btn').forEach(b => b.classList.remove('active-theme'));
                // Marcar el botón activo
                e.currentTarget.classList.add('active-theme');
                // Activar el fondo
                currentTheme = themeIndex;
                isActive = true;

                canvas.classList.add('active');
                label.textContent = themeNames[currentTheme];
                label.style.display = 'block';
                label.style.opacity = '1';

                if(animFrame) cancelAnimationFrame(animFrame);
                initParticles(currentTheme);
                animate();
                setTimeout(()=>{ label.style.opacity='0'; }, 2500);
            };

            const rand=(a,b)=>Math.random()*(b-a)+a;
            const randInt=(a,b)=>Math.floor(rand(a,b+1));
            const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
            const COUNTS=[90,80,70,100,70,80,60,75,85,95,80,65];

            function initParticles(theme){
                particles=[];
                const n=COUNTS[theme]||80;
                for(let i=0;i<n;i++) particles.push(createParticle(theme,true));
            }

            function createParticle(theme,initial){
                const x=rand(0,canvas.width);
                const y=initial?rand(-canvas.height,canvas.height):rand(-120,-10);
                const p={x,y,theme}; applyProps(p,theme); return p;
            }

        function applyProps(p,theme){
            p.speed=rand(1.8,4.5); p.size=rand(14,36); p.opacity=rand(0.75,1);
            p.angle=rand(0,Math.PI*2); p.spin=rand(-0.05,0.05);
            p.drift=rand(-0.9,0.9); p.wobble=rand(0,Math.PI*2); p.wobbleSpeed=rand(0.03,0.08);

            switch(theme){
                case 0: // Círculos de luz — blanco y verde, distintos tamaños
                    p.color=pick(['#ffffff','#e0ffe0','#a8f0a8','#c8ffc8','#f0fff0','#b2ffb2','#d4ffd4']);
                    p.size=rand(10,55); p.speed=rand(3.5,7.0); p.spin=0; p.drift=rand(-0.5,0.5);
                    p.glowIntensity=rand(0.5,1.0); break;

                case 1: // Medias lunas — amarillas y blancas
                    p.color=pick(['#ffe082','#ffd54f','#ffca28','#ffffff','#fff9c4','#ffee58','#fffde7']);
                    p.size=rand(16,50); p.speed=rand(1.8,4.2); p.drift=rand(-1.2,1.2); p.spin=rand(-0.05,0.05); break;

                case 2: // Espadas — más gris y verde, tamaños variados
                    p.color=pick(['#b0bec5','#78909c','#607d8b','#90a4ae','#66bb6a','#4caf50','#81c784','#cfd8dc','#ffd54f','#ef9a9a']);
                    p.size=rand(28,75); p.speed=rand(1.5,3.8); p.spin=rand(-0.05,0.05); p.drift=rand(-0.8,0.8); p.swordType=randInt(0,3); break;

                case 3: // Estrellas — SOLO amarillo
                    p.color=pick(['#ffe082','#ffd54f','#ffca28','#ffb300','#fff59d','#ffee58','#f9a825']);
                    p.size=rand(10,46); p.arms=pick([4,5,6,8]); p.glow=true; p.speed=rand(1.8,4.0); break;

                case 4: // Mariposas — más reales
                    p.color=pick(['#f48fb1','#ce93d8','#80cbc4','#ffcc80','#a5d6a7','#90caf9','#ffe082','#ef9a9a','#ff8a65','#b39ddb']);
                    p.wingColor2=pick(['#f8bbd0','#e1bee7','#b2ebf2','#fff9c4','#c8e6c9','#bbdefb']);
                    p.size=rand(18,55); p.speed=rand(3.5,6.5); p.flutter=rand(0,Math.PI*2); p.flutterSpeed=rand(7.0, 10.0); p.drift=rand(-1.2,1.2); break;

                case 5: // Tortas — más grandes y reales
                    p.color=pick(['#f48fb1','#ffcc80','#ffe082','#a5d6a7','#ce93d8','#ef9a9a','#80deea','#bcaaa4','#fff59d']);
                    p.frostColor=pick(['#ffffff','#f8bbd0','#e1bee7','#b2ebf2','#fff9c4']);
                    p.size=rand(35,80); p.speed=rand(8.0,10.6); p.spin=rand(-0.02,0.02); p.topping=randInt(0,2); p.layers=randInt(1,3); break;

                case 6: // Cruces — más grandes, grises/negras con brillo
                    p.color=pick(['#616161','#424242','#757575','#9e9e9e','#000000','#212121','#37474f','#546e7a']);
                    p.glowColor=pick(['#e0e0e0','#b0bec5','#90a4ae','#ffffff','#78909c']);
                    p.size=rand(28,72); p.speed=rand(6.8,8.5); p.spin=rand(-0.06,0.06); p.crossType=randInt(0,2); break;

                case 7: // Calaveras — más rápidas y reales
                    p.color=pick(['#ffffff','#f5f5f5','#e0e0e0','#bdbdbd','#eeeeee','#fff9c4']);
                    p.size=rand(22,60); p.speed=rand(10.0, 14.0);     // <--- Aumentado para mayor velocidad de desplazamiento
                    p.spin=rand(-0.15, 0.15);     // <--- Opcional: giro más rápido acorde a la velocidad
                    p.flutterSpeed=rand(8.6, 10.6); 
                    p.style=randInt(0,2); 
                    break;

                case 8: // Hojas — distintos tonos de verde
                    p.color=pick(['#2e7d32','#388e3c','#43a047','#4caf50','#66bb6a','#81c784','#1b5e20','#558b2f','#33691e','#8bc34a','#aed581','#689f38']);
                    p.size=rand(18,58); p.speed=rand(6.3,8.6); p.spin=rand(-0.07,0.07); p.drift=rand(-2.5,2.5); p.leafType=randInt(0,3); p.wobbleSpeed=rand(0.14,4.6); break;

                case 9: // Flores — más rápidas
                    p.flowerType=randInt(0,4);
                    p.color=[
                        pick(['#ef5350','#e53935','#c62828','#ff8a80']),
                        pick(['#ff7043','#ff5722','#e64a19','#ff8a65']),
                        pick(['#ffffff','#f8bbd0','#fce4ec']),
                        pick(['#ffd54f','#ffca28','#ffb300']),
                        pick(['#ef5350','#ff1744','#d32f2f','#f48fb1'])
                    ][p.flowerType];
                    p.size=rand(18,48); p.speed=rand(9.4,9.7); p.spin=rand(-0.05,0.05); p.drift=rand(-8.4,7.9); p.wobbleSpeed=rand(0.13,5.8); break;

                case 10: // Moños — tonalidades rosado y rojo
                    p.color=pick(['#f48fb1','#f06292','#e91e63','#ec407a','#ff80ab','#ff4081','#c2185b','#ad1457','#ff8a80','#ff6090']);
                    p.centerColor=pick(['#ffffff','#fce4ec','#f8bbd0']);
                    p.size=rand(20,58); p.speed=rand(6.5,7.8); p.spin=rand(-0.04,0.04); p.drift=rand(-0.6,0.6); break; p.flutterSpeed=rand(6.5,9.8);

                case 11: // Botellas — distintos tipos y colores
                    p.color=pick(['#80cbc4','#4db6ac','#26a69a','#80deea','#4dd0e1','#b2ebf2','#a5d6a7','#81c784','#ce93d8','#b39ddb']);
                    p.size=rand(28,65); p.speed=rand(6.5,9.0); p.spin=rand(-0.03,0.03); p.drift=rand(-0.5,0.5); p.bottleType=randInt(0,2); break;
            }
        }

        /* ===================== DRAW ===================== */
        function drawParticle(p){
            ctx.save(); ctx.globalAlpha=p.opacity; ctx.translate(p.x,p.y); ctx.rotate(p.angle);

            switch(p.theme){
                case 0:  drawLightCircle(p); break;
                case 1:  drawMoon(p);       break;
                case 2:  drawSword(p);      break;
                case 3:  drawStar(p);       break;
                case 4:  drawButterfly(p);  break;
                case 5:  drawCake(p);       break;
                case 6:  drawCross(p);      break;
                case 7:  drawSkull(p);      break;
                case 8:  drawLeaf(p);       break;
                case 9:  drawFlower(p);     break;
                case 10:  drawBow(p);        break;
                case 11:  drawBottle(p);     break;

            }
            ctx.restore();
        }

        /* 0 — Círculos de luz con glow blanco y verde */

        function drawLightCircle(p){
            const r=p.size/2;
            const grd=ctx.createRadialGradient(0,0,r*0.1,0,0,r);

            grd.addColorStop(0,'rgba(255,255,255,0.95)');
            grd.addColorStop(0.35,p.color);
            grd.addColorStop(1,'rgba(255,255,255,0)');

            ctx.shadowColor=p.color; ctx.shadowBlur=r*(1.2+(p.glowIntensity||0.7));
            ctx.globalAlpha=p.opacity*(0.7+0.3*(p.glowIntensity||0.7));
            ctx.fillStyle=grd;
            ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
            // anillo exterior suave
            ctx.shadowBlur=r*2.5;
            ctx.strokeStyle=p.color; ctx.lineWidth=r*0.08; ctx.globalAlpha=0.22*(p.glowIntensity||0.7);
            ctx.beginPath(); ctx.arc(0,0,r*1.18,0,Math.PI*2); ctx.stroke();
            ctx.globalAlpha=p.opacity;
        }

        /* 1 — Media luna PURA (sin burbuja/fondo) */

        function drawMoon(p){
            const r=p.size/2;
            ctx.shadowColor=p.color; ctx.shadowBlur=12;
            // Técnica: dibujar luna con path complejo sin relleno de círculo exterior visible
            ctx.fillStyle=p.color;
            ctx.beginPath();
            // Arco exterior (la luna)
            ctx.arc(0,0,r,Math.PI*0.15,Math.PI*1.85);
            ctx.closePath();
            ctx.fill();
            // Recortar la parte interior para dar forma de luna creciente
            ctx.globalCompositeOperation='destination-out';
            ctx.beginPath();
            ctx.arc(r*0.38, r*0.08, r*0.74, 0, Math.PI*2);
            ctx.fill();
            ctx.globalCompositeOperation='source-over';
        }

        /* 2 — Espadas distintos tipos */

        function drawSword(p){
            const L=p.size, t=p.swordType||0;
            ctx.shadowColor=p.color; ctx.shadowBlur=10; ctx.fillStyle=p.color;
            if(t===0){
                ctx.beginPath(); ctx.moveTo(0,-L*0.52); ctx.lineTo(3.5,L*0.2); ctx.lineTo(-3.5,L*0.2); ctx.closePath(); ctx.fill();
                ctx.fillRect(-L*0.24,L*0.2,L*0.48,L*0.08);
                ctx.fillStyle='#8d6e63'; ctx.fillRect(-3.5,L*0.28,7,L*0.26);

            } else if(t===1){
                ctx.beginPath(); ctx.moveTo(0,-L*0.5); ctx.quadraticCurveTo(L*0.28,0,L*0.12,L*0.22); ctx.lineTo(-L*0.06,L*0.22); ctx.quadraticCurveTo(-L*0.1,0,0,-L*0.5); ctx.closePath(); ctx.fill();
                ctx.fillStyle='#ffd54f'; ctx.fillRect(-L*0.22,L*0.22,L*0.44,L*0.07);
                ctx.fillStyle='#4e342e'; ctx.fillRect(-3,L*0.29,6,L*0.24);

            } else if(t===2){
                ctx.beginPath(); ctx.moveTo(0,-L*0.5); ctx.lineTo(L*0.13,L*0.18); ctx.lineTo(-L*0.13,L*0.18); ctx.closePath(); ctx.fill();
                ctx.fillRect(-L*0.32,L*0.18,L*0.64,L*0.1);
                ctx.fillStyle='#6d4c41'; ctx.fillRect(-4.5,L*0.28,9,L*0.28);

            } else {
                ctx.beginPath(); ctx.moveTo(0,-L*0.56); ctx.lineTo(2,L*0.16); ctx.lineTo(-2,L*0.16); ctx.closePath(); ctx.fill();
                ctx.fillStyle='#212121'; ctx.fillRect(-2,L*0.16,4,L*0.08);
                ctx.fillStyle='#4e342e'; ctx.fillRect(-3,L*0.24,6,L*0.32);
                ctx.beginPath(); ctx.arc(0,L*0.16,L*0.09,0,Math.PI*2); ctx.fillStyle='#ffd54f'; ctx.fill();
            }

        }

        /* 3 — Estrellas SOLO amarillas con brillo */

        function drawStar(p){
            const arms=p.arms||5, outerR=p.size/2, innerR=outerR*0.42;
            ctx.shadowColor='#ffe082'; ctx.shadowBlur=24;
            ctx.fillStyle=p.color;
            ctx.beginPath();

            for(let i=0;i<arms*2;i++){
                const r=i%2===0?outerR:innerR, a=(i*Math.PI/arms)-Math.PI/2;
                if(i===0) ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
                else       ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
            }

            ctx.closePath(); ctx.fill();
            ctx.fillStyle='rgba(255,255,220,0.75)';
            ctx.beginPath(); ctx.arc(0,0,outerR*0.18,0,Math.PI*2); ctx.fill();
        }

        /* 4 — Mariposas con aleteo real */

        function drawButterfly(p){
            const s=p.size, ft=p.flutter||0, flap=Math.cos(ft), sx=Math.abs(flap);
            ctx.shadowColor=p.color; ctx.shadowBlur=8;

            // Alas superiores
            [[- 1],[1]].forEach(([side])=>{
                ctx.save(); ctx.scale(side*sx,1); ctx.fillStyle=p.color;
                ctx.beginPath(); ctx.moveTo(0,0);
                ctx.bezierCurveTo(-s*0.05,-s*0.35,-s*0.58,-s*0.42,-s*0.46,-s*0.05);
                ctx.bezierCurveTo(-s*0.4,s*0.1,-s*0.05,s*0.08,0,0);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle=p.wingColor2||'rgba(255,255,255,0.3)'; ctx.globalAlpha=0.5;
                ctx.beginPath(); ctx.ellipse(-s*0.26,-s*0.16,s*0.14,s*0.09,Math.PI*0.2,0,Math.PI*2); ctx.fill();
                ctx.globalAlpha=p.opacity; ctx.restore();
            });

            // Alas inferiores
            [[- 1],[1]].forEach(([side])=>{
                ctx.save(); ctx.scale(side*sx*0.85,1); ctx.fillStyle=p.color;
                ctx.beginPath(); ctx.moveTo(0,0);
                ctx.bezierCurveTo(-s*0.08,s*0.1,-s*0.46,s*0.36,-s*0.3,s*0.18);
                ctx.bezierCurveTo(-s*0.2,s*0.08,-s*0.05,s*0.05,0,0);
                ctx.closePath(); ctx.fill(); ctx.restore();
            });

            // Cuerpo
            ctx.fillStyle='rgba(30,20,10,0.78)';
            ctx.beginPath(); ctx.ellipse(0,0,s*0.055,s*0.3,0,0,Math.PI*2); ctx.fill();

            // Antenas
            ctx.strokeStyle='rgba(30,20,10,0.65)'; ctx.lineWidth=0.9;
            ctx.beginPath(); ctx.moveTo(-s*0.03,-s*0.28); ctx.quadraticCurveTo(-s*0.2,-s*0.5,-s*0.15,-s*0.56); ctx.stroke();
            ctx.beginPath(); ctx.moveTo( s*0.03,-s*0.28); ctx.quadraticCurveTo( s*0.2,-s*0.5, s*0.15,-s*0.56); ctx.stroke();
            ctx.fillStyle='#333';
            ctx.beginPath(); ctx.arc(-s*0.15,-s*0.56,s*0.03,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc( s*0.15,-s*0.56,s*0.03,0,Math.PI*2); ctx.fill();
        }

        
        /* 5 — Tortas reales con toppings */

        function drawCake(p){
            const s=p.size, layers=p.layers||1, lH=s*0.28, baseY=s*0.3;
            const colors=[p.color,p.frostColor||'#ffffff',pick(['#ffcc80','#ce93d8','#a5d6a7'])];

            ctx.shadowColor=p.color; ctx.shadowBlur=8;

            for(let l=0;l<Math.min(layers+1,3);l++){
                const ly=baseY-l*lH, lw=s*(0.46-l*0.04);
                ctx.fillStyle=colors[l%colors.length];
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(-lw,ly-lH,lw*2,lH,[4,4,0,0]); else ctx.rect(-lw,ly-lH,lw*2,lH);
                ctx.fill();
                ctx.fillStyle='rgba(255,255,255,0.65)'; ctx.fillRect(-lw,ly-lH*0.07,lw*2,lH*0.07);
                if(l===0){ ctx.fillStyle='#5d4037'; ctx.fillRect(-lw,ly-lH*0.32,lw*2,lH*0.09); }
            }

            const topY=baseY-layers*lH;
            if(p.topping===0){
                for(let i=-1;i<=1;i++){
                    ctx.fillStyle='#ef5350'; ctx.beginPath(); ctx.arc(i*s*0.17,topY-s*0.06,s*0.1,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle='#388e3c'; ctx.fillRect(i*s*0.17-s*0.015,topY-s*0.16,s*0.04,s*0.1);
                }

            } else if(p.topping===1){
                for(let i=-1;i<=1;i++){
                    ctx.fillStyle='#b71c1c'; ctx.beginPath(); ctx.arc(i*s*0.17,topY-s*0.06,s*0.09,0,Math.PI*2); ctx.fill();
                    ctx.strokeStyle='#2e7d32'; ctx.lineWidth=1.4;
                    ctx.beginPath(); ctx.moveTo(i*s*0.17,topY-s*0.14); ctx.quadraticCurveTo(i*s*0.17+s*0.1,topY-s*0.24,i*s*0.12,topY-s*0.24); ctx.stroke();
                }

            } else {
                ctx.strokeStyle='#3e2723'; ctx.lineWidth=s*0.055; ctx.lineCap='round';
                for(let i=-1;i<=1;i++){
                    ctx.beginPath(); ctx.moveTo(i*s*0.22,topY); ctx.quadraticCurveTo(i*s*0.22,topY+s*0.1,i*s*0.18,topY+s*0.2); ctx.stroke();
                }
            }

            const cc=['#ef5350','#42a5f5','#66bb6a','#ffa726','#ab47bc','#fff176'];
            for(let c=-1;c<=1;c++){
                const cx=c*s*0.18;
                ctx.fillStyle=pick(cc); ctx.fillRect(cx-s*0.038,topY-s*0.26,s*0.076,s*0.24);
                ctx.fillStyle='#ffe082'; ctx.beginPath(); ctx.ellipse(cx,topY-s*0.32,s*0.05,s*0.09,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='rgba(255,140,0,0.5)'; ctx.beginPath(); ctx.ellipse(cx,topY-s*0.38,s*0.028,s*0.045,0,0,Math.PI*2); ctx.fill();
            }

        }

        

        /* 6 — Cruces grandes variadas con brillo */

        function drawCross(p){
            const s = p.size;
            const w = s * 0.22;  // grosor del brazo

            ctx.shadowColor = p.color;
            ctx.shadowBlur = 14;

            // Sombra exterior para dar profundidad
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(-w/2 + 3, -s/2 + 3, w, s);
            ctx.fillRect(-s/2 + 3, -w/2 + 3, s, w);

            // Cuerpo principal de la cruz
            ctx.fillStyle = p.color;
            ctx.fillRect(-w/2, -s/2, w, s);
            ctx.fillRect(-s/2, -w/2, s, w);

            // Brillo lateral izquierdo
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(-w/2, -s/2, w * 0.3, s);
            ctx.fillRect(-s/2, -w/2, s, w * 0.3);

            // Borde oscuro para efecto 3D
            ctx.strokeStyle = 'rgba(0,0,0,0.6)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-w/2, -s/2, w, s);
            ctx.strokeRect(-s/2, -w/2, s, w);

            // Centro con brillo
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(0, 0, w * 0.35, 0, Math.PI * 2);
            ctx.fill();
        }


        /* 7 — Calaveras más reales */

        function drawSkull(p){
            const s = p.size;

            ctx.shadowColor = p.color;
            ctx.shadowBlur = 12;

            // Cráneo
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(0, -s*0.1, s*0.38, s*0.42, 0, 0, Math.PI*2);
            ctx.fill();

            // Mandíbula
            ctx.beginPath();
            ctx.ellipse(0, s*0.28, s*0.28, s*0.18, 0, 0, Math.PI);
            ctx.fill();

            // Sombra lateral para volumen
            const grad = ctx.createRadialGradient(-s*0.1, -s*0.2, s*0.05, 0, -s*0.1, s*0.42);
            grad.addColorStop(0, 'rgba(255,255,255,0.25)');
            grad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, -s*0.1, s*0.38, s*0.42, 0, 0, Math.PI*2);
            ctx.fill();

            // Cuencas de los ojos
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.beginPath();
            ctx.ellipse(-s*0.13, -s*0.08, s*0.1, s*0.12, -0.2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(s*0.13, -s*0.08, s*0.1, s*0.12, 0.2, 0, Math.PI*2);
            ctx.fill();

            // Nariz
            ctx.beginPath();
            ctx.moveTo(0, s*0.08);
            ctx.lineTo(-s*0.05, s*0.18);
            ctx.lineTo(s*0.05, s*0.18);
            ctx.closePath();
            ctx.fill();

            // Dientes
            ctx.fillStyle = p.color;
            const toothW = s*0.08, toothH = s*0.1;
            for(let i = -1; i <= 1; i++){
                ctx.fillRect(i*toothW*1.1 - toothW/2, s*0.22, toothW - 2, toothH);
            }

            // Línea de separación mandíbula
            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = s*0.03;
            ctx.beginPath();
            ctx.moveTo(-s*0.28, s*0.2);
            ctx.lineTo(s*0.28, s*0.2);
            ctx.stroke();

            // Grietas
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = s*0.015;
            ctx.beginPath();
            ctx.moveTo(-s*0.05, -s*0.35);
            ctx.lineTo(-s*0.02, -s*0.15);
            ctx.lineTo(-s*0.08, -s*0.05);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(s*0.1, -s*0.3);
            ctx.lineTo(s*0.14, -s*0.1);
            ctx.stroke();
        }

        /* 8 — Hojas distintas especies */

        function drawLeaf(p){

            const s=p.size, t=p.leafType||0;

            ctx.shadowColor=p.color; ctx.shadowBlur=8;

            if(t===0){ // Hoja simple con nervaduras

                ctx.fillStyle=p.color;
                ctx.beginPath();
                ctx.moveTo(0,-s*0.5);
                ctx.bezierCurveTo(s*0.4,-s*0.3,s*0.4,s*0.2,0,s*0.5);
                ctx.bezierCurveTo(-s*0.4,s*0.2,-s*0.4,-s*0.3,0,-s*0.5);
                ctx.fill();
                const g0=ctx.createLinearGradient(-s*0.4,0,s*0.4,0);
                g0.addColorStop(0,'rgba(0,0,0,0.28)');
                g0.addColorStop(0.4,'rgba(255,255,255,0.2)');
                g0.addColorStop(1,'rgba(0,0,0,0.22)');
                ctx.fillStyle=g0;
                ctx.beginPath();
                ctx.moveTo(0,-s*0.5);
                ctx.bezierCurveTo(s*0.4,-s*0.3,s*0.4,s*0.2,0,s*0.5);
                ctx.bezierCurveTo(-s*0.4,s*0.2,-s*0.4,-s*0.3,0,-s*0.5);
                ctx.fill();
                ctx.strokeStyle='rgba(0,0,0,0.32)'; ctx.lineWidth=s*0.04;
                ctx.beginPath(); ctx.moveTo(0,-s*0.5); ctx.lineTo(0,s*0.5); ctx.stroke();
                ctx.lineWidth=s*0.018;
                [-0.3,-0.1,0.1,0.3].forEach(y=>{
                    ctx.beginPath(); ctx.moveTo(0,s*y); ctx.lineTo(s*0.3,s*(y-0.12)); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0,s*y); ctx.lineTo(-s*0.3,s*(y-0.12)); ctx.stroke();
                });

            } else if(t===1){ // Hoja de roble irregular

                ctx.fillStyle=p.color;
                ctx.beginPath();
                ctx.moveTo(0,-s*0.5);
                ctx.bezierCurveTo(s*0.15,-s*0.4,s*0.35,-s*0.35,s*0.3,-s*0.2);
                ctx.bezierCurveTo(s*0.45,-s*0.2,s*0.4,-s*0.05,s*0.25,-s*0.05);
                ctx.bezierCurveTo(s*0.4,s*0.05,s*0.35,s*0.2,s*0.2,s*0.18);
                ctx.bezierCurveTo(s*0.3,s*0.3,s*0.15,s*0.45,0,s*0.5);
                ctx.bezierCurveTo(-s*0.15,s*0.45,-s*0.3,s*0.3,-s*0.2,s*0.18);
                ctx.bezierCurveTo(-s*0.35,s*0.2,-s*0.4,s*0.05,-s*0.25,-s*0.05);
                ctx.bezierCurveTo(-s*0.4,-s*0.05,-s*0.45,-s*0.2,-s*0.3,-s*0.2);
                ctx.bezierCurveTo(-s*0.35,-s*0.35,-s*0.15,-s*0.4,0,-s*0.5);
                ctx.fill();
                const g1=ctx.createLinearGradient(-s*0.4,-s*0.3,s*0.2,s*0.3);
                g1.addColorStop(0,'rgba(255,255,255,0.22)');
                g1.addColorStop(0.6,'rgba(0,0,0,0.0)');
                g1.addColorStop(1,'rgba(0,0,0,0.28)');
                ctx.fillStyle=g1;
                ctx.beginPath();
                ctx.moveTo(0,-s*0.5);
                ctx.bezierCurveTo(s*0.15,-s*0.4,s*0.35,-s*0.35,s*0.3,-s*0.2);
                ctx.bezierCurveTo(s*0.45,-s*0.2,s*0.4,-s*0.05,s*0.25,-s*0.05);
                ctx.bezierCurveTo(s*0.4,s*0.05,s*0.35,s*0.2,s*0.2,s*0.18);
                ctx.bezierCurveTo(s*0.3,s*0.3,s*0.15,s*0.45,0,s*0.5);
                ctx.bezierCurveTo(-s*0.15,s*0.45,-s*0.3,s*0.3,-s*0.2,s*0.18);
                ctx.bezierCurveTo(-s*0.35,s*0.2,-s*0.4,s*0.05,-s*0.25,-s*0.05);
                ctx.bezierCurveTo(-s*0.4,-s*0.05,-s*0.45,-s*0.2,-s*0.3,-s*0.2);
                ctx.bezierCurveTo(-s*0.35,-s*0.35,-s*0.15,-s*0.4,0,-s*0.5);
                ctx.fill();
                ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=s*0.032;
                ctx.beginPath(); ctx.moveTo(0,-s*0.5); ctx.lineTo(0,s*0.5); ctx.stroke();

            } else if(t===2){ // Hoja lanceolada fina

                ctx.fillStyle=p.color;
                ctx.beginPath();
                ctx.moveTo(0,-s*0.55);
                ctx.bezierCurveTo(s*0.18,-s*0.2,s*0.18,s*0.2,0,s*0.55);
                ctx.bezierCurveTo(-s*0.18,s*0.2,-s*0.18,-s*0.2,0,-s*0.55);
                ctx.fill();
                const g2=ctx.createLinearGradient(-s*0.18,0,s*0.18,0);
                g2.addColorStop(0,'rgba(0,0,0,0.25)');
                g2.addColorStop(0.35,'rgba(255,255,255,0.3)');
                g2.addColorStop(1,'rgba(0,0,0,0.2)');
                ctx.fillStyle=g2;
                ctx.beginPath();
                ctx.moveTo(0,-s*0.55);
                ctx.bezierCurveTo(s*0.18,-s*0.2,s*0.18,s*0.2,0,s*0.55);
                ctx.bezierCurveTo(-s*0.18,s*0.2,-s*0.18,-s*0.2,0,-s*0.55);
                ctx.fill();
                ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=s*0.03;
                ctx.beginPath(); ctx.moveTo(0,-s*0.55); ctx.lineTo(0,s*0.55); ctx.stroke();
                ctx.lineWidth=s*0.015;
                [-0.3,-0.1,0.1,0.3].forEach(y=>{
                    ctx.beginPath(); ctx.moveTo(0,s*y); ctx.lineTo(s*0.14,s*(y-0.1)); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0,s*y); ctx.lineTo(-s*0.14,s*(y-0.1)); ctx.stroke();
                });

            } else { // Hoja tipo arce con lóbulos

                ctx.fillStyle=p.color;
                ctx.beginPath();
                ctx.moveTo(0,s*0.5);
                ctx.lineTo(0,s*0.1);
                ctx.bezierCurveTo(-s*0.05,-s*0.1,-s*0.1,-s*0.5,0,-s*0.55);
                ctx.bezierCurveTo(s*0.1,-s*0.5,s*0.05,-s*0.1,0,s*0.1);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0,s*0.0);
                ctx.bezierCurveTo(s*0.1,-s*0.05,s*0.45,-s*0.25,s*0.5,-s*0.35);
                ctx.bezierCurveTo(s*0.4,-s*0.18,s*0.2,s*0.0,0,s*0.0);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0,s*0.0);
                ctx.bezierCurveTo(-s*0.1,-s*0.05,-s*0.45,-s*0.25,-s*0.5,-s*0.35);
                ctx.bezierCurveTo(-s*0.4,-s*0.18,-s*0.2,s*0.0,0,s*0.0);
                ctx.fill();
                const g3=ctx.createRadialGradient(-s*0.1,-s*0.2,s*0.05,0,0,s*0.5);
                g3.addColorStop(0,'rgba(255,255,255,0.28)');
                g3.addColorStop(1,'rgba(0,0,0,0.3)');
                ctx.fillStyle=g3;
                ctx.beginPath(); ctx.arc(0,0,s*0.5,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=s*0.03;
                ctx.beginPath(); ctx.moveTo(0,s*0.5); ctx.lineTo(0,-s*0.5); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,s*0.0); ctx.lineTo(s*0.45,-s*0.3); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,s*0.0); ctx.lineTo(-s*0.45,-s*0.3); ctx.stroke();

            }

        }

        /* ===================== LOOP ===================== */

        function animate(){
            if(!isActive) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);

            // SIN relleno de fondo: canvas completamente transparente
            for(let i=0;i<particles.length;i++){
                const p=particles[i];
                p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin; p.wobble+=p.wobbleSpeed;
                if(p.flutter!==undefined) p.flutter+=p.flutterSpeed;
                // Movimiento ondulante mariposas
                if(p.theme===5){ p.x+=Math.sin(p.wobble)*1.2; p.y+=Math.cos(p.wobble*0.4)*0.35; }
                // Péndulo hojas
                if(p.theme===10) p.x+=Math.sin(p.wobble*1.4)*1.4;
                // Bamboleo flores
                if(p.theme===9) p.x+=Math.sin(p.wobble*0.9)*0.55;
                if(p.y>canvas.height+90||p.x<-110||p.x>canvas.width+110){
                    const fresh=createParticle(p.theme,false); particles[i]=fresh;
                } else drawParticle(p);
            }
            animFrame=requestAnimationFrame(animate);
        }

        /* 9 — Flores reales */

        function drawFlower(p){
            const s=p.size, t=p.flowerType||0;
            ctx.shadowColor=p.color; ctx.shadowBlur=8;

            if(t===0){ // Rosa
                ctx.fillStyle=p.color;
                for(let pe=0;pe<5;pe++){
                    ctx.save(); ctx.rotate(pe*Math.PI*2/5);
                    ctx.beginPath(); ctx.moveTo(0,0);
                    ctx.bezierCurveTo(-s*0.2,-s*0.25,-s*0.15,-s*0.5,0,-s*0.45);
                    ctx.bezierCurveTo(s*0.15,-s*0.5,s*0.2,-s*0.25,0,0);
                    ctx.closePath(); ctx.fill(); ctx.restore();
                }

                ctx.fillStyle='#c62828'; ctx.beginPath(); ctx.arc(0,0,s*0.18,0,Math.PI*2); ctx.fill();

            } else if(t===1){ // Tulipán
                ctx.fillStyle=p.color;
                ctx.beginPath(); ctx.moveTo(0,s*0.1);
                ctx.bezierCurveTo(-s*0.36,s*0.05,-s*0.38,-s*0.3,-s*0.18,-s*0.46);
                ctx.bezierCurveTo(-s*0.05,-s*0.56,s*0.05,-s*0.56,s*0.18,-s*0.46);
                ctx.bezierCurveTo(s*0.38,-s*0.3,s*0.36,s*0.05,0,s*0.1);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle='rgba(255,255,255,0.2)';
                ctx.beginPath(); ctx.ellipse(0,-s*0.3,s*0.08,s*0.2,0,0,Math.PI*2); ctx.fill();

            } else if(t===2){ // Margarita
                ctx.fillStyle=p.color;
                for(let pe=0;pe<12;pe++){
                    ctx.save(); ctx.rotate(pe*Math.PI/6);
                    ctx.beginPath(); ctx.ellipse(0,-s*0.32,s*0.08,s*0.22,0,0,Math.PI*2); ctx.fill(); ctx.restore();
                }

                ctx.fillStyle='#ffd54f'; ctx.beginPath(); ctx.arc(0,0,s*0.18,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#f9a825'; ctx.beginPath(); ctx.arc(0,0,s*0.1,0,Math.PI*2); ctx.fill();

            } else if(t===3){ // Girasol

                ctx.fillStyle=p.color;
                for(let pe=0;pe<16;pe++){
                    ctx.save(); ctx.rotate(pe*Math.PI/8);
                    ctx.beginPath(); ctx.ellipse(0,-s*0.36,s*0.1,s*0.22,0,0,Math.PI*2); ctx.fill(); ctx.restore();
                }

                ctx.fillStyle='#4e342e'; ctx.beginPath(); ctx.arc(0,0,s*0.22,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#3e2723';

                for(let d=0;d<8;d++){
                    ctx.save(); ctx.rotate(d*Math.PI/4);
                    ctx.fillRect(-s*0.02,-s*0.18,s*0.04,s*0.09); ctx.restore();
                }

            } else { // Clavel
                ctx.fillStyle=p.color;

                for(let pe=0;pe<8;pe++){
                    ctx.save(); ctx.rotate(pe*Math.PI/4+(p.wobble||0)*0.05);
                    ctx.beginPath(); ctx.moveTo(0,0);
                    ctx.bezierCurveTo(-s*0.18,-s*0.1,-s*0.22,-s*0.42,-s*0.1,-s*0.44);
                    ctx.bezierCurveTo(0,-s*0.46,0,-s*0.46,s*0.1,-s*0.44);
                    ctx.bezierCurveTo(s*0.22,-s*0.42,s*0.18,-s*0.1,0,0);
                    ctx.closePath(); ctx.fill(); ctx.restore();
                }
            }

            // Tallo
            ctx.strokeStyle='#388e3c'; ctx.lineWidth=Math.max(1,s*0.07);
            ctx.beginPath(); ctx.moveTo(0,s*0.1); ctx.lineTo(0,s*0.5); ctx.stroke();

        }

        /* 10 — Moños en tonos rosado y rojo */

        function drawBow(p){
            const s=p.size;
            ctx.shadowColor=p.color; ctx.shadowBlur=10;
            ctx.fillStyle=p.color;

            // Ala izquierda
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(-s*0.12,-s*0.18,-s*0.48,-s*0.22,-s*0.46,-s*0.02);
            ctx.bezierCurveTo(-s*0.44,s*0.18,-s*0.1,s*0.2,0,0);
            ctx.closePath(); ctx.fill();

            // Ala derecha
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(s*0.12,-s*0.18,s*0.48,-s*0.22,s*0.46,-s*0.02);
            ctx.bezierCurveTo(s*0.44,s*0.18,s*0.1,s*0.2,0,0);
            ctx.closePath(); ctx.fill();

            // Brillo en alas
            ctx.fillStyle='rgba(255,255,255,0.22)';
            ctx.beginPath();
            ctx.ellipse(-s*0.24,-s*0.06,s*0.12,s*0.07,0.3,0,Math.PI*2); ctx.fill();
            ctx.beginPath();
            ctx.ellipse(s*0.24,-s*0.06,s*0.12,s*0.07,-0.3,0,Math.PI*2); ctx.fill();

            // Nudo central
            ctx.fillStyle=p.centerColor||'#ffffff';
            ctx.beginPath(); ctx.ellipse(0,0,s*0.1,s*0.12,0,0,Math.PI*2); ctx.fill();

            // Brillo nudo
            ctx.fillStyle='rgba(255,255,255,0.5)';
            ctx.beginPath(); ctx.ellipse(-s*0.02,-s*0.03,s*0.04,s*0.04,0,0,Math.PI*2); ctx.fill();
        }

        /* 11 — Botellas de distintos tipos */

        function drawBottle(p){
            const s=p.size, t=p.bottleType||0;
            ctx.shadowColor=p.color; ctx.shadowBlur=12;
            ctx.fillStyle=p.color;

            if(t===0){ // Botella clásica
                // Cuerpo
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(-s*0.2,s*0.05,s*0.4,s*0.5,[3,3,8,8]);
                else ctx.rect(-s*0.2,s*0.05,s*0.4,s*0.5);
                ctx.fill();

                // Cuello
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(-s*0.1,-s*0.28,s*0.2,s*0.34,[3]);
                else ctx.rect(-s*0.1,-s*0.28,s*0.2,s*0.34);
                ctx.fill();

                // Tapa
                ctx.fillStyle='rgba(255,255,255,0.5)';
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(-s*0.12,-s*0.36,s*0.24,s*0.1,[3]);
                else ctx.rect(-s*0.12,-s*0.36,s*0.24,s*0.1);
                ctx.fill();

                // Brillo
                ctx.fillStyle='rgba(255,255,255,0.25)';
                ctx.beginPath(); ctx.ellipse(-s*0.07,s*0.22,s*0.055,s*0.18,0,0,Math.PI*2); ctx.fill();

            } else if(t===1){ // Botella de vino
                ctx.fillStyle=p.color;

                // Cuerpo redondeado
                ctx.beginPath(); ctx.ellipse(0,s*0.32,s*0.22,s*0.28,0,0,Math.PI*2); ctx.fill();

                // Cuello largo
                ctx.beginPath();

                if(ctx.roundRect) ctx.roundRect(-s*0.07,-s*0.3,s*0.14,s*0.45,[4]);
                else ctx.rect(-s*0.07,-s*0.3,s*0.14,s*0.45);
                ctx.fill();

                // Corcho
                ctx.fillStyle='#bcaaa4';
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(-s*0.065,-s*0.38,s*0.13,s*0.1,[3]);
                else ctx.rect(-s*0.065,-s*0.38,s*0.13,s*0.1);
                ctx.fill();

                // Brillo
                ctx.fillStyle='rgba(255,255,255,0.22)';
                ctx.beginPath(); ctx.ellipse(-s*0.08,s*0.2,s*0.05,s*0.14,0,0,Math.PI*2); ctx.fill();

            } else { // Botella con tapa dorada

                ctx.fillStyle=p.color;
                // Cuerpo hexagonal aprox
                ctx.beginPath();
                ctx.moveTo(-s*0.22,s*0.55); ctx.lineTo(-s*0.24,s*0.1);
                ctx.lineTo(-s*0.12,-s*0.04); ctx.lineTo(-s*0.1,-s*0.28);
                ctx.lineTo(s*0.1,-s*0.28); ctx.lineTo(s*0.12,-s*0.04);
                ctx.lineTo(s*0.24,s*0.1); ctx.lineTo(s*0.22,s*0.55);
                ctx.closePath(); ctx.fill();

                // Tapa dorada
                ctx.fillStyle='#ffd54f';
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(-s*0.13,-s*0.42,s*0.26,s*0.16,[4,4,0,0]);
                else ctx.rect(-s*0.13,-s*0.42,s*0.26,s*0.16);
                ctx.fill();

                // Brillo
                ctx.fillStyle='rgba(255,255,255,0.22)';
                ctx.beginPath(); ctx.ellipse(-s*0.08,s*0.24,s*0.06,s*0.18,0,0,Math.PI*2); ctx.fill();
            }
        }

        })();

        }); // fin DOMContentLoaded

    // Cerrar el panel selector al hacer click fuera del ícono diamante

    document.addEventListener('click', function(e){

        const wallpaperIcon = document.getElementById('wallpaper-icon');
        const panel = document.getElementById('wallpaper-selector');

        if(!wallpaperIcon.contains(e.target)){
            panel.classList.remove('open');
            window._selectorOpen = false;
        }
    });
    </script>

    <canvas id="wallpaper-canvas"></canvas>

    <div id="wallpaper-label"></div>


</body>
