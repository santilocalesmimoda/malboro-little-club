<style>
/* tus estilos sin cambios */
body {
    display: flex;
    /* Ajustado para centrar el contenido principal */
    justify-content: center;
    align-items: flex-start; /* Alineación al inicio (arriba) */
    min-height: 100vh;
    background-color: #7ccd98;
    margin: 0;
    padding-top: 50px; /* Pequeño espacio arriba para que no esté pegado al borde */
    font-family: Arial, sans-serif;
}

/* NUEVO CONTENEDOR PRINCIPAL para el video y su info */
.main-content {
    width: 70%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
}


.video-container {
    position: relative;
    width: 100%; 
    background-color: #000;
    border-radius: 8px;
    overflow: hidden;
}

.video-container video {
    width: 100%;
    display: block;
}

.controls-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    padding: 5px 15px;
    box-sizing: border-box;
    transition: opacity 0.3s ease-in-out;
    opacity: 0;
    pointer-events: none;
    height: 45px;
}

.video-container.show-controls .controls-bar {
    opacity: 1;
    pointer-events: auto;
}

.control-button {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.4em;
    cursor: pointer;
    margin: 0 6px;
    transition: color 0.2s;
    display: flex;
    padding: 2px;
    position: relative;
    align-items: center;
    justify-content: center;
}

.progress-container {
    position: absolute;
    bottom: 45px;
    left: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.7);
    padding: 0 15px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    height: 30px;
    transition: opacity 0.3s ease-in-out;
    opacity: 0;
    pointer-events: none;
}


.video-container.show-controls .progress-container {
    opacity: 1;
    pointer-events: auto;
}

/* --- CAMBIOS APLICADOS AQUÍ --- */
.progress-bar {
    flex-grow: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 5px;
    margin: 2px;
    cursor: pointer;
    outline: none;
    --progress-value: 0%;
    background: linear-gradient(to right, #4CAF50 var(--progress-value), #555 var(--progress-value));
}

.progress-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    background-color: #4CAF50;
    border-radius: 50%;
    cursor: grab;
}

.progress-bar::-moz-range-thumb {
    width: 16px;
    height: 16px;
    background-color: #4CAF50;
    border-radius: 50%;
    cursor: grab;
}

.time-display {
    color: #fff;
    font-size: 0.9em;
    white-space: nowrap;
    margin-right: 15px;
}

.right-controls {
    display: flex;
    align-items: center;
    margin-left: auto;
}

.volume-bar {
    width: 80px;
    -webkit-appearance: none;
    appearance: none;height: 4px;
    border-radius: 5px;
    margin-left: 5px;
    margin-right: 20px;
    cursor: pointer;
    outline: none;
    /* Variables de color para la barra de volumen */
    --volume-color: #4CAF50; /* Verde claro */
    --background-color: #555; /* Gris claro */
    --volume-value: 100%; /* Valor inicial */
    background: linear-gradient(to right, var(--volume-color), var(--volume-color) var(--volume-value), var(--background-color) var(--volume-value), var(--background-color));
}

/* Estilo del pulgar (el botón) para Chrome/Safari */
.volume-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    background: var(--volume-color);
    border-radius: 50%;
    cursor: grab;
}

/* Estilo del pulgar (el botón) para Firefox */
.volume-bar::-moz-range-thumb {
    width: 12px;
    height: 12px;
    background: var(--volume-color);
    border-radius: 50%;
    cursor: grab;
}

.seek-button {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

.seek-button .seek-seconds {
    font-size: 0.1em;
    color: #fff;
    margin-top: 1px;
    display: block;
}


.icon-expand,
.icon-compress {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: block;
    width: 30px;
    height: 30px;
}


.control-button i {
    font-size: 1.2em;
}

.control-button .bx {
    font-size: 1.5em;
}

.hidden {
    display: none !important;
}

#playPauseBtn {
    width: 20px;
    height: 20px;
}

#playPauseBtn .icon-play,
#playPauseBtn .icon-pause {
    position: absolute;
    top: 50%;
    left: 20%;
    transform: translate(-50%, -50%);
    display: block;
    font-size: 1.2em;
    color: #fff;
}

.control-button i:not(.icon-play):not(.icon-pause) {
    font-size: 1.2em;
}

#fullscreenBtn {
    margin-left: 10px;
}

.control-button i {
    margin: 0 5px;
}

#volumeBtn {
    position: relative;
    width: 45px;
    height: 45px;
    overflow: hidden;
}


/* BLOQUE YOUTUBE ESTILOS AJUSTADOS PARA MEJOR FORMATO */
.mlc-video-title {
    font-size: 1.4rem;
    font-weight: bold;
    color: #083;
    margin-top: 15px;
    margin-bottom: 15px; /* Espacio después del título */
    padding: 0 5px;
}

.mlc-info-box {
    /* Ocupa el 100% del main-content */
    width: 100%; 
    margin: 0; /* Sin margen externo adicional */
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
}

.mlc-left {
    display: flex;
    align-items: center;
}

.mlc-avatar {
    width: 60px; /* Tamaño reducido para parecerse más a la imagen */
    height: 60px;
    border-radius: 50%;
    margin-right: 12px;
}

/* Contenedor de iconos: Like, Compartir, Descargar */
.mlc-icons-box {
    /* Ocupa el 100% del main-content */
    width: 100%; 
    margin: 10px 0 0 0; /* Espacio después del bloque del canal */
    display: flex;
    gap: 10px; /* Espacio entre los botones de icono */
    padding: 5px;
}


/* RESPONSIVE simple: si el ancho es menor, apila los elementos */
@media (max-width: 800px) {
    .main-content {
        width: 90%;
    }
    .mlc-info-box {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }
    .mlc-actions {
        margin-left: 52px; /* Alinea los botones debajo del nombre del canal */
    }
}


.mlc-channel-username {
    font-size: 20px;
    font-family: "Inter", sans-serif;
    font-weight: bold;
    color: #222;
    cursor: pointer;
    transition: color 0.2s;
}

.mlc-subs {
    font-size: 0.85rem;
    color: #606060;
}

.mlc-actions {
    display: flex;
    gap: 10px;
    margin-left: 15px;
}

.mlc-btn {
    border: none;
    cursor: pointer;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.95rem;
    font-weight: bold;
    white-space: nowrap;
    background-color: #2e8b57;
    color: white;
    transition: background-color 0.2s;
}

.mlc-btn.subscribed {
    background-color: #e0e0e0 !important;
    color: #333 !important;
}


/* --- SECCIÓN DE COMENTARIOS --- */
.comments-section {
    width: 100%;
    margin-top: 30px;
    padding: 0 5px;
    box-sizing: border-box;
}

.comments-title {
    font-size: 1.6rem;
    color: #111;
    margin-bottom: 10px;
    text-align: left; 
    font-weight: bold;
    font-family: "Outfit", sans-serif; 
    padding-left: 10px;
}

.comment-box {
    display: flex;
    align-items: center;
    background-color: #2e8b57;
    border-radius: 12px;
    padding: 6px 10px;
    margin-bottom: 20px;
}

.comment-input {
    flex-grow: 1;
    border: none;
    background: transparent;
    color: #fff;
    padding: 5px;
    font-size: 1rem;
    min-height: 25px; 
    max-height: 100px;
    resize: none; 
    line-height: 1.5;
    outline: none;
    font-weight: bold;
    font-family: "Outfit", sans-serif;
    overflow-y: hidden; 
    margin-right: 10px;
}

.comment-input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

.send-button {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.6em; 
    cursor: pointer;
    margin: 0; 
    padding: 5px;
    flex-shrink: 0;
}

#commentsList {
    display: flex;
    flex-direction: column;
    gap: 15px; 
    padding: 10px;
}

.comment-item {
    display: flex;
    align-items: flex-start;
}

.comment-avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    margin-right: 12px;
    flex-shrink: 0;
    overflow: hidden;
}

.comment-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.comment-content {
    display: flex;
    flex-direction: column;
    font-size: 0.95rem;
    color: #333;
}

.comment-user {
    font-family: "Inter", sans-serif;
    font-size: 0.85rem;
    color: #111;
    margin-bottom: 0px;
}

.comment-text {
    line-height: 1.6;
    word-wrap: break-word;
    font-family: "Inter", sans-serif;
    margin: 0;
    padding: 0;
}

/* Acciones de comentario estilo YouTube */
.comment-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
    font-size: 0.85rem;
    color: #606060;
}

.comment-action-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #0f0f0f;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.9rem;
    padding: 4px 6px;
    border-radius: 12px;
    transition: background-color 0.2s;
}

.comment-action-btn:hover {
    background-color: rgba(0, 0, 0, 0.08);
}

.comment-action-btn.active {
    color: #0e6d28;
}

.reply-btn-text {
    font-weight: 600;
    font-size: 0.8rem;
    color: #0f0f0f;
}

.replies-container {
    margin-left: 50px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.reply-box {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    margin-left: 50px;
}

.reply-input {
    flex-grow: 1;
    border: none;
    border-bottom: 1px solid #7ccd98;
    background: transparent;
    padding: 4px;
    font-size: 0.9rem;
    outline: none;
    font-family: "Inter", sans-serif;
}

.reply-send-btn {
    background-color: #2e8b57;
    color: white;
    border: none;
    border-radius: 16px;
    padding: 4px 12px;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
}

/* Estilos para los nuevos botones */
.interaction-bar {
    width: 100%;
    display: flex;
    justify-content: center; /* Centra los iconos */
    gap: 60px;               /* Espacio entre los dos */
    margin: 20px 0;          /* Margen arriba y abajo para que sea equidistante */
    padding: 10px 0;
}

/* ANIMACIÓN SUAVE */
.interaction-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 2.2rem;       /* Tamaño grande para que se vean bien */
    transition: transform 0.15s ease, opacity 0.15s ease;
    display: flex;
    align-items: center;
}

.mlc-right-icons {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-left: auto; /* EMPUJA TODO A LA DERECHA */
}

.mlc-channel-username {
    font-size: 20px;
    font-family: "Inter", sans-serif;
    font-weight: bold;
    color: #222;
    cursor: pointer;
    transition: color 0.2s;
}

.mlc-channel-username:hover {
    color: #2e8b57;
}

.mlc-subs {
    font-size: 0.85rem;
    color: #606060;
}

.reblog {
    color: #4CAF50;          /* Verde para las flechas */
}

.reblog-menu {
    position: absolute;
    background: #fff;
    width: 240px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 8px 0;
    z-index: 999;
    font-family: "Inter", sans-serif;
    font-size: 14px; /* 👈 CLAVE */
}

/* HEADER USUARIO */
.reblog-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
    font-size: 14px;
}

.reblog-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
}

/* OPCIONES */
.reblog-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.15s ease;
}

/* CONTENIDO IZQUIERDO (icono + texto) */
.reblog-option-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* ICONOS */
.reblog-option i {
    width: 18px;
    text-align: center;
    color: #555;
}

/* TEXTO */
.reblog-option span {
    font-size: 14px;
    color: #222;
}

/* ATAJOS */
.shortcut {
    font-size: 12px;
    color: #888;
}

/* HOVER */
.reblog-option:hover {
    background: #f5f5f5;
}

/* NOTIFICACIÓN - REEMPLAZO TOTAL */
.reblog-notification {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #00cf35;
    color: #000;
    padding: 8px 16px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    z-index: 2147483647;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

/* Esta clase es la que el JavaScript activará */
.reblog-notification.visible {
    visibility: visible !important;
    opacity: 1 !important;
    bottom: 70px !important; /* Sube un poquito al aparecer */
}

.notification-content {
    display: flex;
    align-items: center;
    gap: 6px;
}

.reblog-notification.show {
    opacity: 1; /* Se vuelve visible cuando tiene esta clase */
}


.reblog-notification.active {
    visibility: visible !important;
    opacity: 1 !important;
    bottom: 50px !important;
    display: flex !important; /* Asegura que se comporte como bloque visible */
}


.hidden {
    display: none !important;
}

.notification-content i.fa-check-circle {
    font-size: 14px;
}

.notification-content i.fa-arrow-right {
    margin-left: 6px;
    font-size: 12px;
}

.like {
    color: #f44336;          /* Rojo para el corazón */
}

/* Clase para cuando el corazón está activo (relleno) */
.like.active i {
    font-weight: 900;
}

/* CORAZÓN ACTIVO MÁS INTENSO */
.like.active {
    color: #e53935;
}

.like-count {
    font-size: 0.75rem;
    font-family: "Inter", sans-serif;
    font-optical-sizing: auto;
    font-weight: weight;
    font-style: normal;
    margin-left: 4px;
    color: #333;
}

</style>

<div class="main-content">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('myVideo');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const iconPlay = playPauseBtn.querySelector('.icon-play');
            const iconPause = playPauseBtn.querySelector('.icon-pause');
            const rewindBtn = document.getElementById('rewindBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const progressBar = document.getElementById('progressBar');
            const timeDisplay = document.getElementById('timeDisplay');
            const volumeBtn = document.getElementById('volumeBtn');
            const volumeBar = document.getElementById('volumeBar');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const videoContainer = document.querySelector('.video-container');
            const iconExpand = fullscreenBtn.querySelector('.icon-expand');
            const iconCompress = fullscreenBtn.querySelector('.icon-compress');

            let controlsTimeout;

            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = Math.floor(seconds % 60);
                const formattedMinutes = String(minutes).padStart(0);
                const formattedSeconds = String(remainingSeconds).padStart(2, '0');
                return `${formattedMinutes}:${formattedSeconds}`;
            }

            videoContainer.addEventListener('mousemove', () => {
                videoContainer.classList.add('show-controls');
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    if (!video.paused) {
                        videoContainer.classList.remove('show-controls');
                    }
                }, 3000);
            });

            videoContainer.addEventListener('mouseleave', () => {
                clearTimeout(controlsTimeout);
                if (!video.paused) {
                    videoContainer.classList.remove('show-controls');
                }
            });

            video.addEventListener('pause', () => {
                videoContainer.classList.add('show-controls');
            });

            video.addEventListener('play', () => {
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    videoContainer.classList.remove('show-controls');
                }, 3000);
            });

            playPauseBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                    iconPlay.classList.add('hidden');
                    iconPause.classList.remove('hidden');
                } else {
                    video.pause();
                    iconPlay.classList.remove('hidden');
                    iconPause.classList.add('hidden');
                }
            });

            rewindBtn.addEventListener('click', () => {
                video.currentTime -= 10;
            });

            forwardBtn.addEventListener('click', () => {
                video.currentTime += 10;
            });

            video.addEventListener('timeupdate', () => {
                const progress = (video.currentTime / video.duration) * 100;
                progressBar.value = progress;

                progressBar.style.setProperty('--progress-value', `${progress}%`);

                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            });

            progressBar.addEventListener('input', () => {
                const time = (progressBar.value / 100) * video.duration;
                video.currentTime = time;
            });

            volumeBar.addEventListener('input', () => {
                video.volume = volumeBar.value / 100;
                // Esta es la línea que debes agregar o modificar
                volumeBar.style.setProperty('--volume-value', `${volumeBar.value}%`);
                updateVolumeIcon();
            });

            function updateVolumeIcon() {
                if (video.volume === 0 || video.muted) {
                    volumeBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else if (video.volume < 0.5) {
                    volumeBtn.innerHTML = '<i class="fas fa-volume-down"></i>';
                } else {
                    volumeBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            }

            volumeBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                volumeBar.value = video.muted ? 0 : video.volume * 100;
                updateVolumeIcon();
            });

            video.addEventListener('volumechange', () => {
                updateVolumeIcon();
                if (!video.muted) {
                    volumeBar.value = video.volume * 100;
                }
            });

            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (videoContainer.requestFullscreen) {
                        videoContainer.requestFullscreen();
                    } else if (videoContainer.mozRequestFullScreen) {
                        videoContainer.mozRequestFullScreen();
                    } else if (videoContainer.webkitRequestFullscreen) {
                        videoContainer.webkitRequestFullscreen();
                    } else if (videoContainer.msRequestFullscreen) {
                        videoContainer.msRequestFullscreen();
                    }
                    iconExpand.classList.add('hidden');
                    iconCompress.classList.remove('hidden');
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                    iconExpand.classList.remove('hidden');
                    iconCompress.classList.add('hidden');
                }
            });

            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    iconExpand.classList.remove('hidden');
                    iconCompress.classList.add('hidden');
                }
            });

            video.addEventListener('ended', () => {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                video.currentTime = 0;v
                progressBar.value = 0;
                videoContainer.classList.add('show-controls');
            });

            video.addEventListener('loadedmetadata', () => {
                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            });

            videoContainer.classList.add('show-controls');
        });
    </script>

    <!-- Script de Suscripción con localStorage -->
    <script>
        const channelUsername = document.getElementById('channelUsername');
        const subscribeBtn = document.getElementById('subscribeBtn');
        const subsCountSpan = document.getElementById('subsCount');
        
        let isSubscribed = localStorage.getItem('mlc_isSubscribed') === 'true';
        let suscriptoresTotal = parseInt(localStorage.getItem('mlc_subsCount')) || 0;

        function actualizarInterfazSubs() {
            if (isSubscribed) {
                subscribeBtn.textContent = 'Suscrito';
                subscribeBtn.classList.add('subscribed');
            } else {
                subscribeBtn.textContent = 'Suscribirse';
                subscribeBtn.classList.remove('subscribed');
            }
            subsCountSpan.textContent = suscriptoresTotal;
        }

        function toggleSubscription() {
            isSubscribed = !isSubscribed;
            if (isSubscribed) {
                suscriptoresTotal++;
            } else {
                suscriptoresTotal = Math.max(0, suscriptoresTotal - 1);
            }
            localStorage.setItem('mlc_isSubscribed', isSubscribed);
            localStorage.setItem('mlc_subsCount', suscriptoresTotal);
            actualizarInterfazSubs();
        }

        actualizarInterfazSubs();
        channelUsername.addEventListener('click', toggleSubscription);
        subscribeBtn.addEventListener('click', toggleSubscription);
    </script>
